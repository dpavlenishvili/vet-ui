<div class="vet-program-card">
  <div class="vet-program-card-details">
    @for (item of items(); track item.label) {
      <div class="vet-program-card-detail-item">
        <strong>{{ item.label | trans }}:</strong>
        <span [innerHTML]="item.value"></span>
      </div>
    }
  </div>

  <div>
    <kendo-svg-icon
      [icon]="vetIcons.paletteBg"
      [style.width]="'60px'"
      [style.height]="'60px'"
    />
  </div>
</div>
