@let _iscedList = normalizedList();

<div class="vet-program-data-section">
  <div class="vet-program-data-section-title">
    {{ 'shorts.employment_field' | transloco }}
  </div>

  <div class="vet-program-data-section-content dimmed">
    @if (_iscedList.length) {
      @for (item of _iscedList; track $index) {
        <div>{{ item }}</div>
      }
    } @else {
      <div class="k-text-center k-text-base">
        {{ 'shorts.no_isced_found' | transloco }}
      </div>
    }
  </div>
</div>
