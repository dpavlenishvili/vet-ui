@if (totalPrograms() !== 0) {
  <div class="vet-total">
    {{ 'shared.numberOfRecords' | transloco: { count: totalPrograms() } }}
  </div>
}

<div class="vet-non-formal-grid">
  @if (allPrograms().length === 0 && !nonFormals.isLoading()) {
    <div class="loader-container">
      {{ 'shared.noRecords' | transloco }}
    </div>
  } @else {
    @for (item of allPrograms(); track item?.id) {
      <vet-non-formal-program-card 
        class="vet-non-formal-grid-item" 
        [program]="item" 
      />
    }
  }
</div>

@if (nonFormals.isLoading()) {
  <div class="loader-container">
    <kendo-loader [type]="'pulsing'" />
  </div>
}
