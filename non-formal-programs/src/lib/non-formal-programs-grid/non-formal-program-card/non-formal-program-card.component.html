@let _program = sanitizedProgram();

<div class="vet-non-formal-card">
  <div class="vet-non-formal-card-header">
    <vet-program-isced-icon [iconId]="_program.isced_code"/>

    <div class="vet-non-formal-card-heading">
      <div class="vet-non-formal-card-title">
        {{ _program.isced }} <span class="separator">|</span> {{ 'non_formal.code' | transloco }}:
        {{ _program.isced_code }}
      </div>
      <!-- <div class="vet-non-formal-card-subtitle">{{ 'non_formal.recognition_result' | transloco }}: {{ 'non_formal.not_available_yet' | transloco }}</div> -->
    </div>
  </div>

  <div class="vet-non-formal-card-field-container">
    {{ _program.organisation?.name }}
  </div>

  <div class="vet-non-formal-card-footer">
    <div class="vet-non-formal-card-location">
      <kendo-svg-icon [icon]="vetIcons.locationPin" />
      <span class="vet-non-formal-card-address">{{ _program.organisation?.address }}</span>
    </div>

    <a
      [routerLink]="['/programs/non-formal', _program.id]"
      [queryParams]="{ programName: _program.isced }"
      class="vet-non-formal-card-link"
    >
      {{ 'non_formal.view_details' | transloco }}
    </a>
  </div>
</div>
