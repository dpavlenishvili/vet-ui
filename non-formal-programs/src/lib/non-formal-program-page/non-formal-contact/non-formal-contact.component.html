@let org = program().organisation;

@if (org) {
  <div class="vet-nf-contact">
    <div class="vet-nf-contact-grid">
      @if (org.phone) {
        <div class="vet-nf-contact-item">
          <kendo-svg-icon [icon]="vetIcons.phone" />
          <a [href]="'tel:' + org.phone">{{ org.phone }}</a>
        </div>
      }

      @if (org.email) {
        <div class="vet-nf-contact-item">
          <kendo-svg-icon [icon]="vetIcons.envelopeMini" />
          <a [href]="'mailto:' + org.email">{{ org.email }}</a>
        </div>
      }

      @if (org.website) {
        <div class="vet-nf-contact-item">
          <kendo-svg-icon [icon]="vetIcons.globeMini" />
          <a [href]="org.website" target="_blank" rel="noopener noreferrer">
            {{ org.website }}
          </a>
        </div>
      }

      @if (org.address) {
        <div class="vet-nf-contact-item">
          <kendo-svg-icon [icon]="vetIcons.locationPin" />
          <span>{{ org.address }}</span>
        </div>
      }
    </div>
  </div>
}
