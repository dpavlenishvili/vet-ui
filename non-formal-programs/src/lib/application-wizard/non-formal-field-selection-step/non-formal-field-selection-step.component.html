<div class="non-formal-field-selection-step">
  <vet-non-formal-programs-filters
    [filters]="filters()"
    (filtersChange)="onFiltersChange($event)"
  />

  <div class="k-mt-4">
    <vet-non-formal-field-selection-grid
      [data]="programsResource"
      [selectedProgramId]="selectedProgramId()"
      [isViewMode]="isViewMode()"
      (programToggle)="onProgramToggle($event)"
      (pageChange)="onPageChange($event)"
    />
  </div>

  <div class="k-display-flex k-justify-content-end k-mt-4">
    <button
      kendoButton
      themeColor="primary"
      [disabled]="!selectedProgramId()"
      (click)="onNextClick()"
    >
      {{ 'shared.next' | transloco }}
    </button>
  </div>
</div>
