envVars:
  APP_NAME: Culture 
  



ingress:
  enabled: true
  className: 'nginx'
  annotations:
    nginx.org/client-max-body-size: '100m'
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/forwarded-for-header: "X-Forwarded-For"
    nginx.ingress.kubernetes.io/proxy-add-original-forwarded-for: "true"
  hosts:
    - host: new.vet.ge
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: prod01-public
      hosts:
        - new.vet.ge

  
resources:
  limits:
    cpu: 2000m
    memory: 2000Mi
  requests:
    cpu: 100m
    memory: 100Mi


volumeMounts:
  - name: tz-config
    mountPath: /etc/localtime

volumes:
  - name: tz-config
    hostPath:
      path: /usr/share/zoneinfo/Asia/Tbilisi


