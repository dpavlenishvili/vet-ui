<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div vet-container>
    <div vet-row>
      <div vet-row>
        <div vet-row>
          <vet-input self-grow [placeholder]="'shared.search' | transloco" formControlName="search" />
        </div>

        @if (!isExpanded()) {
          <div vet-spacer></div>
          <ng-container *ngTemplateOutlet="buttons" />
        }
      </div>

      @if (isExpanded()) {
        <div vet-row>
          <vet-selector
            self-grow
            [placeholder]="'organisations.organisation_type' | transloco"
            formControlName="institution_type_id"
            [options]="institutionTypesOptions.value() ?? []"
          />

          <vet-selector
            self-grow
            [placeholder]="'organisations.organisation_kind' | transloco"
            formControlName="org_type"
            [options]="institutionOrgType.value() ?? []"
          />
        </div>
      }
    </div>

    @if (isExpanded()) {
      <div vet-row>
        <div vet-row>
          <vet-selector
            formControlName="region"
            [placeholder]="'programs.region' | transloco"
            [options]="regionOptions.value()"
            [filterable]="true"
          />

          <vet-selector
            formControlName="district"
            [placeholder]="'programs.district' | transloco"
            [options]="filteredDistricts()"
            [filterable]="true"
          />
        </div>

        <vet-selector
          self-grow
          formControlName="id"
          [placeholder]="'programs.institution_name' | transloco"
          [options]="institutionOptions.value()"
          [filterable]="true"
        />
      </div>

      <div vet-row>
        <div vet-row></div>
        <div vet-row content-right>
          <ng-container *ngTemplateOutlet="buttons" />
        </div>
      </div>
    }
  </div>
</form>

<ng-template #buttons>
  <div vet-line gap-dense content-right>
    @let toggleBtnIcon = isExpanded() ? 'arrowUp' : 'arrowDown';

    <vet-icon-button [icon]="toggleBtnIcon" (click)="onToggleExpansion()" />
    <vet-icon-button icon="close" (click)="onClearClick()" />

    <vet-button leadingIcon="search" type="submit">
      {{ 'shorts.search_filters' | transloco }}
    </vet-button>
  </div>
</ng-template>
