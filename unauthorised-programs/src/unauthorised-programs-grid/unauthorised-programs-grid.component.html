<div class="vet-unauthorised-grid">
  @if (allPrograms().length === 0 && !unAuthorisedPrograms.isLoading()) {
    <div class="loader-container">
      {{ 'shared.noRecords' | transloco }}
    </div>
  } @else {
    @for (item of allPrograms(); track item?.id) {
      <vet-program-card 
        class="vet-unauthorised-grid-item" 
        [program]="item" 
        [programDetailsPath]="'/programs'" 
      />
    }
  }
</div>

@if (unAuthorisedPrograms.isLoading()) {
  <div class="loader-container">
    <kendo-loader [type]="'pulsing'" />
  </div>
}
